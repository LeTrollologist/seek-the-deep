<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seek the Deep — Print</title>
<link rel="stylesheet" href="print.css">
</head>
<body>
<div class="print-toolbar">
    <div class="print-brand">
        <img src="icons/icon48.png" width="32" height="32" alt="">
        <div>
            <strong>Seek the Deep</strong>
            <span id="toolbarMeta">Preparing your conversation…</span>
        </div>
    </div>
    <div class="print-actions">
        <button type="button" id="printBtn" class="print-button primary" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v6H7z"/></svg>
            Print / Save as PDF
        </button>
        <button type="button" id="closeBtn" class="print-button ghost">Close</button>
    </div>
</div>

<div id="status" class="print-status" role="status">Preparing document…</div>

<main class="paper">
    <div id="doc" class="doc"></div>
</main>

<script src="shared.js"></script>
<script src="print.js"></script>
</body>
</html>
